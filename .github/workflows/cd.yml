name: Continuous Delivery - Build & Push Docker Images

on:
  push:
    branches:
      - main
      - develop
      - ci/push-image-registry
      - ci/docker-image-tagging
    tags:
      - 'v*.*.*'
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      push_images:
        description: 'Push built images to Container Registry'
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  docker-build-push:
    name: Build & Push Images to Registry (GHCR / Docker Hub)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up QEMU (Multi-platform support)
        uses: docker/setup-qemu-action@v3

      - name: 3. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 4. Prepare environment variables
        id: prep
        run: |
          # Chuyển đổi tên repository owner về chữ thường theo chuẩn OCI/Docker
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lower=$OWNER_LOWER" >> $GITHUB_OUTPUT

          # Xác định điều kiện push: true khi không phải pull_request hoặc khi dispatch chọn true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SHOULD_PUSH="false"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHOULD_PUSH="${{ github.event.inputs.push_images }}"
          else
            SHOULD_PUSH="true"
          fi
          echo "should_push=$SHOULD_PUSH" >> $GITHUB_OUTPUT

          # Kiểm tra cấu hình Docker Hub secrets
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "has_dockerhub=true" >> $GITHUB_OUTPUT
          else
            echo "has_dockerhub=false" >> $GITHUB_OUTPUT
          fi

      # -------------------------------------------------------------
      # ĐĂNG NHẬP REGISTRY
      # -------------------------------------------------------------
      - name: 5. Log in to GitHub Container Registry (GHCR)
        if: steps.prep.outputs.should_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 6. Log in to Docker Hub (nếu có cấu hình Secrets)
        if: steps.prep.outputs.should_push == 'true' && steps.prep.outputs.has_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -------------------------------------------------------------
      # BACKEND API: METADATA & BUILD/PUSH
      # -------------------------------------------------------------
      - name: 7. Extract metadata (Tags & Labels) for Backend API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: |
            name=ghcr.io/${{ steps.prep.outputs.owner_lower }}/brewlite-api,enable=true
            name=${{ secrets.DOCKERHUB_USERNAME }}/brewlite-api,enable=${{ steps.prep.outputs.has_dockerhub == 'true' }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: 8. Build and Push Backend API Image
        id: build-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ steps.prep.outputs.should_push == 'true' }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------------------------------------------
      # FRONTEND WEB: METADATA & BUILD/PUSH
      # -------------------------------------------------------------
      - name: 9. Extract metadata (Tags & Labels) for Frontend Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: |
            name=ghcr.io/${{ steps.prep.outputs.owner_lower }}/brewlite-web,enable=true
            name=${{ secrets.DOCKERHUB_USERNAME }}/brewlite-web,enable=${{ steps.prep.outputs.has_dockerhub == 'true' }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: 10. Build and Push Frontend Web Image
        id: build-web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ steps.prep.outputs.should_push == 'true' }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------------------------------------------
      # BÁO CÁO TỔNG HỢP (JOB SUMMARY)
      # -------------------------------------------------------------
      - name: 11. Generate Deployment & Registry Report
        if: always()
        run: |
          echo "## 🚀 Continuous Delivery: Docker Images Push Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Thuộc tính | Chi tiết |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger Event** | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Git Ref** | \`${{ github.ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Push to Registry** | \`${{ steps.prep.outputs.should_push }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **GitHub Container Registry (GHCR)** | \`ghcr.io/${{ steps.prep.outputs.owner_lower }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Docker Hub Enabled** | \`${{ steps.prep.outputs.has_dockerhub }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Danh sách Tags đã sinh cho Backend API" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta-api.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Danh sách Tags đã sinh cho Frontend Web" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta-web.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  deploy-production-notify:
    name: Trigger Production Deployment (Render / Vercel Webhook)
    needs: [docker-build-push]
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}

    steps:
      - name: Check Render Deploy Hook Secret
        id: check-hook
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "has_hook=true" >> $GITHUB_OUTPUT
          else
            echo "has_hook=false" >> $GITHUB_OUTPUT
            echo "RENDER_DEPLOY_HOOK_URL secret is not configured; skipping automatic webhook trigger."
          fi

      - name: Trigger Render Service Deploy
        if: steps.check-hook.outputs.has_hook == 'true'
        run: |
          echo "Triggering Render deployment webhook..."
          curl -sS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Render deployment triggered successfully!"
