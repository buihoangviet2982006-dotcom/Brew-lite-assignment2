name: Triển khai liên tục

on:
  workflow_run:
    workflows: ["Tích hợp liên tục"]
    types: [completed]
    branches: [main]

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-production:
    name: Chạy migration Render, triển khai API Render và Web Vercel
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Lấy mã nguồn đã được kiểm thử
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cài đặt thư viện
        run: npm ci

      - name: Xác nhận mã nguồn vẫn là phiên bản mới nhất trên nhánh main
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$current_sha" != "$EXPECTED_SHA" ]; then
            echo "Nhánh main đã có phiên bản mới hơn; dừng triển khai mã nguồn cũ $EXPECTED_SHA."
            exit 1
          fi

      - name: Áp dụng migration Prisma lên Render PostgreSQL
        run: npm run prisma:deploy --workspace=@brewlite/api
        env:
          DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.RENDER_DATABASE_URL }}

      - name: Xác nhận nhánh main chưa có phiên bản mới hơn
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$current_sha" != "$EXPECTED_SHA" ]; then
            echo "Nhánh main đã thay đổi sau migration; dừng triển khai mã nguồn cũ $EXPECTED_SHA."
            exit 1
          fi

      - name: Kích hoạt triển khai API trên Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK" || {
            echo "Chưa cấu hình RENDER_DEPLOY_HOOK trong môi trường thật."
            exit 1
          }
          curl --fail --silent --show-error \
            --output /dev/null \
            --request POST \
            "$RENDER_DEPLOY_HOOK"

      - name: Chờ API sẵn sàng
        env:
          API_PRODUCTION_URL: ${{ vars.API_PRODUCTION_URL }}
        run: |
          test -n "$API_PRODUCTION_URL" || {
            echo "Chưa cấu hình API_PRODUCTION_URL trong môi trường thật."
            exit 1
          }
          sleep 20
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error \
              --output /dev/null \
              "${API_PRODUCTION_URL%/}/health"; then
              echo "Kiểm tra sức khỏe API thành công."
              exit 0
            fi
            echo "API chưa sẵn sàng (lần thử $attempt/36)."
            sleep 10
          done
          echo "API chưa sẵn sàng sau 6 phút."
          exit 1

      - name: Xác nhận nhánh main chưa có phiên bản mới hơn
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$current_sha" != "$EXPECTED_SHA" ]; then
            echo "Nhánh main đã có phiên bản mới hơn; dừng triển khai Web từ mã nguồn cũ $EXPECTED_SHA."
            exit 1
          fi

      - name: Kích hoạt triển khai Web trên Vercel
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          test -n "$VERCEL_DEPLOY_HOOK" || {
            echo "Chưa cấu hình VERCEL_DEPLOY_HOOK trong môi trường thật."
            exit 1
          }
          curl --fail --silent --show-error \
            --output /dev/null \
            --request POST \
            "$VERCEL_DEPLOY_HOOK"

      - name: Chờ trang menu hoạt động
        env:
          WEB_PRODUCTION_URL: ${{ vars.WEB_PRODUCTION_URL }}
        run: |
          test -n "$WEB_PRODUCTION_URL" || {
            echo "Chưa cấu hình WEB_PRODUCTION_URL trong môi trường thật."
            exit 1
          }
          sleep 20
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error \
              --output /dev/null \
              "${WEB_PRODUCTION_URL%/}/menu"; then
              echo "Kiểm tra nhanh trang Web thành công."
              exit 0
            fi
            echo "Web chưa sẵn sàng (lần thử $attempt/36)."
            sleep 10
          done
          echo "Web chưa hoạt động sau 6 phút."
          exit 1
