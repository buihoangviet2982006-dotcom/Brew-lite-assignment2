name: Continuous Delivery

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '.dockerignore'
      - 'apps/api/Dockerfile'
      - 'apps/web/Dockerfile'
      - 'apps/web/next.config.mjs'
      - '.github/workflows/cd.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: ${{ github.repository_owner }}/brewlite-api
  WEB_IMAGE_NAME: ${{ github.repository_owner }}/brewlite-web

jobs:
  build-and-tag-images:
    name: Build & Tag Docker Images (API & Web)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api_tags: ${{ steps.meta_api.outputs.tags }}
      web_tags: ${{ steps.meta_web.outputs.tags }}
      api_version: ${{ steps.meta_api.outputs.version }}

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Task 5.3 - STT 3 (Hoàng Gia Bảo): Bổ sung bước docker/login-action tại đây và bật push: true ở bước 5 & 6

      - name: 3. Extract Docker metadata & tags for API (Commit SHA & SemVer)
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 4. Extract Docker metadata & tags for Web (Commit SHA & SemVer)
        id: meta_web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 5. Build & Tag @brewlite/api Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          load: true
          push: false
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          cache-from: type=gha,scope=brewlite-api
          cache-to: type=gha,mode=max,scope=brewlite-api

      - name: 6. Build & Tag @brewlite/web Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          load: true
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}
            NEXT_PUBLIC_APP_NAME=${{ vars.NEXT_PUBLIC_APP_NAME || 'BrewLite' }}
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
          cache-from: type=gha,scope=brewlite-web
          cache-to: type=gha,mode=max,scope=brewlite-web

      - name: 7. Verify built Docker Images & Tags
        run: |
          echo "=== Generated API Tags ==="
          echo "${{ steps.meta_api.outputs.tags }}"
          echo "=== Generated Web Tags ==="
          echo "${{ steps.meta_web.outputs.tags }}"
          echo "=== Built Docker Images ==="
          docker images