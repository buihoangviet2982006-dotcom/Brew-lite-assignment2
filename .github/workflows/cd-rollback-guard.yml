name: CD Pipeline Guard & Automated Rollback

on:
  push:
    branches:
      - main
      - develop
      - "ci/**"
  pull_request:
    branches:
      - main
      - develop
      - "ci/task-5.3-cd-deploy"
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Môi trường cần Rollback (staging / production)"
        required: true
        default: "staging"
      rollback_to_sha:
        description: "Mã Commit (SHA) ổn định cần khôi phục về"
        required: false
        default: ""

concurrency:
  group: cd-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # BƯỚC 1: CỔNG KIỂM SOÁT CHẤT LƯỢNG (DỪNG PIPELINE NGAY KHI CÓ LỖI)
  # ------------------------------------------------------------------
  quality-gate-fail-fast:
    name: "1. Quality Gate (Fail-Fast on Error)"
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies (Stop on Failure)
        continue-on-error: false
        run: npm ci

      - name: Run Lint Check (Stop Pipeline if Lint Fails)
        continue-on-error: false
        run: npm run lint --if-present

      - name: Run Unit Tests (Stop Pipeline if Tests Fail)
        continue-on-error: false
        run: npm test --if-present

      - name: Build Application (Stop Pipeline if Build Fails)
        continue-on-error: false
        run: npm run build --if-present

  # ------------------------------------------------------------------
  # BƯỚC 2: KIỂM TRA TRIỂN KHAI & SMOKE TEST
  # (Tự động bị chặn nếu Bước 1 xảy ra bất kỳ lỗi nào)
  # ------------------------------------------------------------------
  deploy-verification:
    name: "2. Deploy Gate & Smoke Verification"
    runs-on: ubuntu-latest
    needs: [quality-gate-fail-fast]
    if: github.event_name != 'workflow_dispatch' && success()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Record Pre-Deploy Stable Commit
        id: stable_ref
        run: |
          PREV_SHA=$(git rev-parse --short HEAD~1 2>/dev/null || echo "initial")
          echo "last_stable_sha=${PREV_SHA}" >> "$GITHUB_OUTPUT"
          echo "📌 Phiên bản ổn định dự phòng để Rollback: ${PREV_SHA}"

      - name: Verify Deployment Health / Smoke Check
        continue-on-error: false
        env:
          DEPLOY_HEALTHCHECK_URL: ${{ secrets.DEPLOY_HEALTHCHECK_URL }}
        run: |
          if [ -n "${DEPLOY_HEALTHCHECK_URL}" ]; then
            echo "Đang kiểm tra trạng thái phản hồi của máy chủ..."
            curl --fail --silent --show-error --retry 3 --retry-delay 5 "${DEPLOY_HEALTHCHECK_URL}"
          else
            echo "✅ Đã vượt qua toàn bộ cổng kiểm tra Build/Test. Cho phép phát hành!"
          fi

  # ------------------------------------------------------------------
  # BƯỚC 3: KỊCH BẢN ROLLBACK TỰ ĐỘNG KHI PIPELINE LỖI HOẶC KÍCH HOẠT TAY
  # ------------------------------------------------------------------
  automated-rollback:
    name: "3. Automated Rollback on Pipeline/Deploy Failure"
    runs-on: ubuntu-latest
    needs: [quality-gate-fail-fast, deploy-verification]
    if: always() && (needs.quality-gate-fail-fast.result == 'failure' || needs.deploy-verification.result == 'failure' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Execute Rollback Script
        env:
          ROLLBACK_WEBHOOK_URL: ${{ secrets.ROLLBACK_WEBHOOK_URL }}
          DEPLOY_HEALTHCHECK_URL: ${{ secrets.DEPLOY_HEALTHCHECK_URL }}
        run: |
          chmod +x scripts/rollback-deploy.sh
          ENV_NAME="${{ github.event.inputs.target_environment || 'staging' }}"
          TARGET_SHA="${{ github.event.inputs.rollback_to_sha || '' }}"
          bash scripts/rollback-deploy.sh "${ENV_NAME}" "${{ github.sha }}" "${TARGET_SHA}"

      - name: Upload Rollback Audit Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollback-audit-report-${{ github.run_id }}
          path: rollback-logs/
          retention-days: 14