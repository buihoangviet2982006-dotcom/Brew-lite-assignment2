name: Tích hợp liên tục

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, ci/setup-github-actions]

jobs:
  quality-gate:
    name: Cài đặt, kiểm tra mã nguồn, kiểm thử và build
    runs-on: ubuntu-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 1. Cài đặt thư viện
        run: |
          npm ci

      - name: 2. Sinh Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public
          DIRECT_URL: postgresql://build:build@localhost:5432/build?schema=public

      - name: 3. Kiểm tra quy chuẩn mã nguồn
        run: npm run lint

      - name: 4. Chạy kiểm thử
        run: npm run test

      - name: 5. Build ứng dụng
        run: npm run build
